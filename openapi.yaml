components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AnnouncementRequest:
      type: object
      properties:
        title: {type: string, maxLength: 128, minLength: 0}
        body: {type: [string, 'null'], maxLength: 4096, minLength: 0}
        url: {type: [string, 'null'], maxLength: 2048, minLength: 0}
        priority: {type: [integer, 'null'], format: int32, maximum: 1000, minimum: 0}
        active: {type: [boolean, 'null']}
        starts_at: {type: [string, 'null'], format: date-time}
        ends_at: {type: [string, 'null'], format: date-time}
      required: [title]
    AnnouncementResponse:
      type: object
      properties:
        id: {type: integer, format: int64}
        title: {type: string}
        body: {type: [string, 'null']}
        url: {type: [string, 'null']}
        priority: {type: integer, format: int32}
        starts_at: {type: [string, 'null'], format: date-time}
        ends_at: {type: [string, 'null'], format: date-time}
    AdminAnnouncementResponse:
      type: object
      properties:
        id: {type: integer, format: int64}
        title: {type: string}
        body: {type: [string, 'null']}
        url: {type: [string, 'null']}
        priority: {type: integer, format: int32}
        active: {type: boolean}
        starts_at: {type: [string, 'null'], format: date-time}
        ends_at: {type: [string, 'null'], format: date-time}
        created_by: {type: integer, format: int64}
        updated_by: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AnnouncementPage:
      type: object
      properties:
        content:
          type: array
          items: {$ref: '#/components/schemas/AdminAnnouncementResponse'}
        page: {type: integer, format: int32}
        size: {type: integer, format: int32}
        total_elements: {type: integer, format: int64}
        total_pages: {type: integer, format: int64}
    TrendingPostResponse:
      type: object
      properties:
        id: {type: integer, format: int64}
        post_id: {type: integer, format: int32}
        title: {type: string}
        user_id: {type: integer, format: int64}
        department_id: {type: integer, format: int64}
        approved_at: {type: string, format: date-time}
        recent_upvotes: {type: integer, format: int64}
        recent_downvotes: {type: integer, format: int64}
    TrendingResponse:
      type: object
      properties:
        calculated_at: {type: string, format: date-time}
        window: {type: string}
        content:
          type: array
          items: {$ref: '#/components/schemas/TrendingPostResponse'}
    AuditEventPage:
      type: object
      properties:
        content:
          type: array
          items: {$ref: '#/components/schemas/AuditEventResponse'}
        page: {type: integer, format: int32}
        size: {type: integer, format: int32}
        total_elements: {type: integer, format: int64}
        total_pages: {type: integer, format: int64}
    AuditEventResponse:
      type: object
      properties:
        id: {type: integer, format: int64}
        actor_id: {type: [integer, 'null'], format: int64}
        action: {type: string}
        target_type: {type: string}
        target_id: {type: [integer, 'null'], format: int64}
        outcome: {type: string}
        occurred_at: {type: string, format: date-time}
        correlation_id: {type: string}
        metadata:
          type: object
          additionalProperties: {}
    AdminDashboardResponse:
      type: object
      properties:
        calculated_at: {type: string, format: date-time}
        timezone: {type: string}
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        users: {$ref: '#/components/schemas/Users'}
        posts: {$ref: '#/components/schemas/Posts'}
        moderation: {$ref: '#/components/schemas/Moderation'}
        engagement: {$ref: '#/components/schemas/Engagement'}
    Users:
      type: object
      properties:
        active: {type: integer, format: int64}
        deleted: {type: integer, format: int64}
        by_role:
          type: object
          additionalProperties: {type: integer, format: int64}
    Posts:
      type: object
      properties:
        active: {type: integer, format: int64}
        deleted: {type: integer, format: int64}
        by_status:
          type: object
          additionalProperties: {type: integer, format: int64}
        created_in_period: {type: integer, format: int64}
        approved_versions_in_period: {type: integer, format: int64}
        legacy_approved_versions_without_date: {type: integer, format: int64}
    Moderation:
      type: object
      properties:
        pending: {type: integer, format: int64}
    Engagement:
      type: object
      properties:
        attachments: {type: integer, format: int64}
        attachment_bytes: {type: integer, format: int64}
        attachments_without_known_size: {type: integer, format: int64}
        upvotes: {type: integer, format: int64}
        downvotes: {type: integer, format: int64}
        vault_saves: {type: integer, format: int64}
    UserStatsResponse:
      type: object
      properties:
        approved_post_count:
          type: integer
          format: int64
          description: Distinct logical posts with approved/latest/non-deleted version rows
          minimum: 0
        upvotes_received:
          type: integer
          format: int64
          description: Stored upvotes on eligible version rows
          minimum: 0
        downvotes_received:
          type: integer
          format: int64
          description: Stored downvotes on eligible version rows
          minimum: 0
    SubjectStatsResponse:
      type: object
      properties:
        approved_post_count:
          type: integer
          format: int64
          description: Distinct logical posts with approved/latest/non-deleted version rows linked to this subject
          minimum: 0
        last_approved_post_at:
          type: [string, 'null']
          format: date-time
          description: Latest eligible Post.updated_at in its existing stored clock; null when empty
    PasswordRecoveryRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 0
          pattern: '^[A-Za-z0-9+_.-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$'
    PasswordResetRequest:
      type: object
      required: [new_password, token]
      properties:
        token:
          type: string
          maxLength: 43
          minLength: 43
          pattern: '[A-Za-z0-9_-]{43}'
          writeOnly: true
        new_password:
          type: string
          maxLength: 72
          minLength: 8
          writeOnly: true
    ApiErrorResponse:
