openapi: 3.1.0
info:
  title: arca API
  version: v1
servers:
- url: https://arca-backend.dcism.org
  description: Production
- url: http://localhost:20255
  description: Local development
paths:
  /api/v1/vaults/edit-label:
    put:
      tags:
      - vault-controller
      operationId: editLabel
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditVaultLabelRequest"
        required: true
      responses:
        "200":
          description: Label updated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VaultResponse"
  /api/v1/user/{userId}:
    get:
      tags:
      - user-controller
      operationId: getUserDetails
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
    put:
      tags:
      - user-controller
      operationId: updateUser
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
        required: true
      responses:
        "200":
          description: User updated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MessageResponse"
    delete:
      tags:
      - user-controller
      operationId: deleteUser
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: User deleted
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /api/v1/user/{userId}/profile-picture:
    get:
      tags:
      - user-controller
      operationId: getProfilePicture
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Profile picture
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          description: Profile picture not found
    put:
      tags:
      - user-controller
      operationId: updateProfilePicture
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        "200":
          description: Profile picture updated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProfilePictureResponse"
  /api/v1/subject/{subjectId}:
    get:
      tags:
      - subject-controller
      operationId: getSubjectDetails
      parameters:
      - name: subjectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubjectResponse"
    put:
      tags:
      - subject-controller
      operationId: updateSubject
      parameters:
      - name: subjectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubjectRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubjectResponse"
    delete:
      tags:
      - subject-controller
      operationId: deleteSubject
      parameters:
      - name: subjectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
  /api/v1/schools/edit/{id}:
    put:
      tags:
      - school-controller
      operationId: editSchool
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchoolRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SchoolResponse"
  /api/v1/posts/{rowId}:
    get:
      tags:
      - post-controller
      operationId: getPost
      parameters:
      - name: rowId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PostResponse"
    put:
      tags:
      - post-controller
      operationId: updatePost
      parameters:
      - name: rowId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostUpdateRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PostUpdateResponse"
    delete:
      tags:
      - post-controller
      operationId: deletePost
      parameters:
      - name: rowId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "501":
          description: Post deletion is not implemented
  /api/v1/departments/{id}:
    get:
      tags:
      - department-controller
      operationId: getDepartment
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DepartmentDetailResponse"
    put:
      tags:
      - department-controller
      operationId: updateDepartment
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DepartmentDetailResponse"
    delete:
      tags:
      - department-controller
      operationId: deleteDepartment
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
  /api/v1/admin/users/{id}/roles/remove:
    put:
      tags:
      - admin-controller
      operationId: removeRole
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleRequest"
        required: true
      responses:
        "200":
          description: Role removed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /api/v1/admin/users/{id}/roles/add:
    put:
      tags:
      - admin-controller
      operationId: addRole
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleRequest"
        required: true
      responses:
        "200":
          description: Role added
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /api/v1/admin/users/{id}/promote:
    put:
      tags:
      - admin-controller
      operationId: promoteToAdmin
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: User promoted
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /api/v1/admin/users/{id}/demote:
    put:
      tags:
      - admin-controller
      operationId: demoteFromAdmin
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: User demoted
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /api/v1/votes:
    post:
      tags:
      - vote-controller
      operationId: vote
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoteRequest"
        required: true
      responses:
        "200":
          description: Vote saved
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VoteResponse"
        "204":
          description: Existing vote removed
  /api/v1/vaults/add:
    post:
      tags:
      - vault-controller
      operationId: addToVault
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VaultRequest"
        required: true
      responses:
        "200":
          description: Post saved
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /api/v1/user:
    get:
      tags:
      - user-controller
      operationId: getAllUser
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserResponse"
    post:
      tags:
      - user-controller
      operationId: createUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
  /api/v1/subject:
    get:
      tags:
