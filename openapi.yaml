  /api/v1/votes:
    post:
      tags:
      - vote-controller
      operationId: vote
      description: Request post_id is a post version database row id, not logical post_id. All operations require parent-post visibility; new votes require APPROVED status even for owner/admin.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoteRequest"
        required: true
      responses:
        "200":
          description: Vote saved
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VoteResponse"
        "204":
          description: Existing vote removed
        "404":
          description: Post not found, including deleted posts
        "401":
          description: Authentication required
        "400":
          description: Invalid request or vote on a visible non-approved post
  /api/v1/vaults/add:
    post:
      tags:
      - vault-controller
      operationId: addToVault
      description: Request post_id is a post version database row id, not logical post_id. Parent post must be readable; saved entry belongs to authenticated user.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VaultRequest"
        required: true
      responses:
        "200":
          description: Post saved
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: Post not found, including deleted posts
        "401":
          description: Authentication required
        "400":
          description: Invalid request
        "409":
          description: Post already saved by current user
