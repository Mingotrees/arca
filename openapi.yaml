      tags:
      - admin-controller
      operationId: createAdmin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
        required: true
      responses:
        "201":
          description: Admin created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /api/v1/admin/banned-emails:
    get:
      tags:
      - admin-controller
      operationId: listBannedEmails
      responses:
        "200":
          description: Banned emails
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BannedEmailResponse"
    post:
      tags:
      - admin-controller
      operationId: banEmail
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BanEmailRequest"
        required: true
