    put:
      tags:
      - user-controller
      operationId: updateUser
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
        required: true
      responses:
        "200":
          description: User updated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MessageResponse"
    delete:
      tags:
      - user-controller
      operationId: deleteUser
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: User deleted
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /api/v1/user/{userId}/profile-picture:
    get:
      tags:
      - user-controller
      operationId: getProfilePicture
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Profile picture
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          description: Profile picture not found
    put:
      tags:
      - user-controller
      operationId: updateProfilePicture
      description: Owner/admin uploads JPEG, PNG or WebP. Maximum 10 MiB per file/request and 25000000 decoded pixels. Public reads remain supported.
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        "200":
          description: Profile picture updated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProfilePictureResponse"
        "400":
          description: Invalid or mismatched image
        "401":
          description: Authentication required
        "403":
          description: Only owner/admin may replace avatar
        "404":
          description: User not found
        "413":
          description: Upload exceeds 10 MiB limit
        "415":
          description: Unsupported media type or extension
