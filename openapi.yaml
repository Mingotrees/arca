  /api/v1/files/upload:
    post:
      tags:
      - file-controller
      operationId: uploadFile
      description: Owner/admin upload to a post version row. JPEG, PNG or PDF only; at most three files per version, 10 MiB per file and multipart request, and 25000000 decoded pixels per image. Extension, declared MIME and content must agree.
      parameters:
      - name: user_id
        in: query
        description: Ignored; acting user is the authenticated JWT principal
        deprecated: true
        required: false
        schema:
          type: integer
          format: int64
      - name: post_id
        in: query
        description: Post version database row id, not logical post_id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: array
                  items:
                    type: string
                    format: binary
              required:
              - file
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MultipleFileUploadRequest"
        "400":
          description: Invalid, empty or mismatched upload
        "403":
          description: Visible post may only be modified by owner/admin
        "404":
          description: Post missing, deleted or inaccessible
        "413":
          description: Upload exceeds 10 MiB limit
        "415":
          description: Unsupported media type or file extension
        "401":
          description: Authentication required
