  /api/v1/posts/{rowId}:
    get:
      tags:
      - post-controller
      operationId: getPost
      parameters:
      - name: rowId
        in: path
        description: Post version database row id, not logical post_id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PostResponse"
        "404":
          description: Post missing, deleted or inaccessible
    put:
      tags:
      - post-controller
      operationId: updatePost
      parameters:
      - name: rowId
        in: path
        description: Post version database row id, not logical post_id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostUpdateRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PostUpdateResponse"
        "403":
          description: Visible post may only be modified by owner/admin
        "404":
          description: Post missing, deleted or inaccessible
    delete:
      tags:
      - post-controller
      operationId: deletePost
      summary: Soft-delete a logical post
      description: Owner/admin soft-deletes every version sharing the logical post_id. Rows and files are retained; repeated authorized deletion returns 204.
      security:
      - bearerAuth: []
      parameters:
      - name: X-Request-ID
        in: header
        description: "Optional correlation ID: 1-64 letters, digits, dots, underscores or hyphens; invalid values are replaced by a UUID"
        schema:
          type: string
      - name: rowId
        in: path
        description: Database row id of any version, not logical post_id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Logical post deleted; no response body
          headers:
            X-Request-ID:
              description: Safe request correlation ID
              style: simple
              schema:
                type: string
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                type: object
              example:
                error: unauthorized
                message: Authentication required
        "403":
          description: Only owner/admin may delete a visible active post
          content:
            application/json:
              schema:
                type: object
              example:
                timestamp: "2026-11-14T09:00:00"
                status: 403
                error: ResponseStatusException
                message: Only post owner or admin may modify this post
        "404":
          description: Row missing or deleted post inaccessible to caller
          content:
            application/json:
              schema:
                type: object
              example:
                timestamp: "2026-11-14T09:00:00"
                status: 404
                error: ResponseStatusException
                message: Post not found
