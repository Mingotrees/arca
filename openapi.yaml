      - name: postId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Current vote
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VoteResponse"
        "204":
          description: No current vote
  /api/v1/votes/{postId}/downvotes:
