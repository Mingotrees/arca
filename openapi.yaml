      properties:
        id:
          type: integer
          format: int64
        firstName:
          type: string
        lastName:
          type: string
        password:
          type: string
        email:
          type: string
        course:
          type: string
        department:
          type: string
        bio:
          type: string
        profilePicture:
          type: string
        deletedAt:
          type: string
          format: date-time
        roles:
          type: array
          items:
            type: string
          uniqueItems: true
        deleted:
          type: boolean
    ProfilePictureResponse:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        profilePicture:
          type: string
        message:
          type: string
    SubjectRequest:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        aliases:
          type: array
          items:
            type: string
        departmentIds:
          type: array
          items:
            type: integer
            format: int64
    DepartmentResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    SubjectResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        name:
          type: string
        aliases:
          type: array
          items:
            type: string
        departments:
          type: array
          items:
            $ref: "#/components/schemas/DepartmentResponse"
    SchoolRequest:
      type: object
      properties:
