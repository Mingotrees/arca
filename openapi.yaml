  /api/v1/schools:
    get:
      tags:
      - school-controller
      operationId: getAllSchools
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SchoolResponse"
    post:
      tags:
      - school-controller
      operationId: addSchool
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchoolRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SchoolResponse"
  /api/v1/posts:
    get:
      tags:
      - post-controller
      operationId: getAllPosts
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PostResponse"
    post:
      tags:
      - post-controller
      operationId: createPost
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostRequest"
        required: true
      responses:
        "201":
          description: Post created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PostCreateResponse"
  /api/v1/posts/{postId}/approve:
    post:
      tags:
      - post-controller
      operationId: approvePost
      parameters:
      - name: postId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostApprovalRequest"
        required: true
      responses:
        "200":
          description: Post moderation completed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /api/v1/files/upload:
    post:
      tags:
      - file-controller
      operationId: uploadFile
      parameters:
      - name: user_id
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: post_id
        in: query
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: array
                  items:
                    type: string
                    format: binary
              required:
              - file
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MultipleFileUploadRequest"
  /api/v1/departments:
    get:
      tags:
      - department-controller
      operationId: getAllDepartments
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DepartmentDetailResponse"
    post:
      tags:
      - department-controller
      operationId: createDepartment
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DepartmentDetailResponse"
  /api/v1/auth/register:
    post:
      tags:
      - auth-controller
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          description: Registered
