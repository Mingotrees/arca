openapi: 3.1.0
info:
  title: arca API
  version: v1
  description: >-
    JSON errors use timestamp, status, error and message fields. Resource authorization
    conceals missing, deleted and inaccessible posts with 404. Owners/admins may
    read active private versions; other authenticated users may read APPROVED
    versions only. Vault entry and missing public-avatar reads retain empty 404
    responses. Successful payloads retain existing field names and response shapes.
servers:
- url: https://arca-backend.dcism.org
  description: Production
- url: http://localhost:20255
  description: Local development
paths:
  /api/v1/admin/announcements:
    get:
      tags: [admin-announcement-controller]
      summary: List announcements for administration
      description: Includes active, inactive, expired and future global announcements; excludes deleted. Stable created_at DESC,id DESC. Page defaults0/max10000, size defaults20/max100. Requires ANNOUNCEMENTS_ENABLED.
      operationId: listAnnouncements
      parameters:
      - name: page
        in: query
        required: false
        schema: {type: integer, format: int32, maximum: 10000, minimum: 0}
      - name: size
        in: query
        required: false
        schema: {type: integer, format: int32, maximum: 100, minimum: 1}
      responses:
        '400':
          description: Invalid announcement or bounds
          content: {application/json: {schema: {$ref: '#/components/schemas/ApiErrorResponse'}}}
        '401':
          description: Authentication required
          content: {application/json: {schema: {$ref: '#/components/schemas/ApiErrorResponse'}}}
        '403':
          description: Admin required
          content: {application/json: {schema: {$ref: '#/components/schemas/ApiErrorResponse'}}}
        '404':
          description: Module disabled or announcement missing/deleted
          content: {application/json: {schema: {$ref: '#/components/schemas/ApiErrorResponse'}}}
        '200':
          description: Admin announcement page
          content: {application/json: {schema: {$ref: '#/components/schemas/AnnouncementPage'}}}
      security:
      - bearerAuth: []
    post:
      tags: [admin-announcement-controller]
      summary: Create global announcement
      description: Admin only. Requires ANNOUNCEMENTS_ENABLED, default false. Title max128, plain-text body max4096 or validated HTTP(S) URL max2048 required. Priority defaults0, active defaultsfalse. UTC starts_at inclusive/ends_at exclusive, nullable bounds, microsecond precision, years1000–9999. No URL fetching. Creation and redacted audit event commit atomically; actor comes from authenticated account.
      operationId: createAnnouncement
      requestBody:
        content: {application/json: {schema: {$ref: '#/components/schemas/AnnouncementRequest'}}}
        required: true
      responses:
        '400':
          description: Invalid announcement or bounds
          content: {application/json: {schema: {$ref: '#/components/schemas/ApiErrorResponse'}}}
        '401':
          description: Authentication required
          content: {application/json: {schema: {$ref: '#/components/schemas/ApiErrorResponse'}}}
        '403':
          description: Admin required
          content: {application/json: {schema: {$ref: '#/components/schemas/ApiErrorResponse'}}}
        '404':
          description: Module disabled or announcement missing/deleted
          content: {application/json: {schema: {$ref: '#/components/schemas/ApiErrorResponse'}}}
        '201':
          description: Announcement created
          content: {application/json: {schema: {$ref: '#/components/schemas/AdminAnnouncementResponse'}}}
      security:
      - bearerAuth: []
  /api/v1/admin/announcements/{id}:
    get:
      tags: [admin-announcement-controller]
      summary: Read announcement for administration
      operationId: getAnnouncement
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: integer, format: int64}
      responses:
        '400':
          description: Invalid announcement or bounds
          content: {application/json: {schema: {$ref: '#/components/schemas/ApiErrorResponse'}}}
        '401':
          description: Authentication required
          content: {application/json: {schema: {$ref: '#/components/schemas/ApiErrorResponse'}}}
        '403':
          description: Admin required
          content: {application/json: {schema: {$ref: '#/components/schemas/ApiErrorResponse'}}}
        '404':
          description: Module disabled or announcement missing/deleted
          content: {application/json: {schema: {$ref: '#/components/schemas/ApiErrorResponse'}}}
        '200':
          description: Admin announcement
          content: {application/json: {schema: {$ref: '#/components/schemas/AdminAnnouncementResponse'}}}
      security:
      - bearerAuth: []
    put:
      tags: [admin-announcement-controller]
      summary: Replace announcement
      description: 'Full replacement, not PATCH: omitted active/priority/bounds become false/0/null. Existing creation metadata is retained. Serializes with deletion; update and audit event commit atomically.'
      operationId: replaceAnnouncement
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: integer, format: int64}
      requestBody:
        content: {application/json: {schema: {$ref: '#/components/schemas/AnnouncementRequest'}}}
        required: true
      responses:
        '400':
          description: Invalid announcement or bounds
          content: {application/json: {schema: {$ref: '#/components/schemas/ApiErrorResponse'}}}
        '401':
          description: Authentication required
          content: {application/json: {schema: {$ref: '#/components/schemas/ApiErrorResponse'}}}
        '403':
          description: Admin required
          content: {application/json: {schema: {$ref: '#/components/schemas/ApiErrorResponse'}}}
        '404':
          description: Module disabled or announcement missing/deleted
          content: {application/json: {schema: {$ref: '#/components/schemas/ApiErrorResponse'}}}
        '200':
          description: Announcement replaced
          content: {application/json: {schema: {$ref: '#/components/schemas/AdminAnnouncementResponse'}}}
      security:
      - bearerAuth: []
    delete:
      tags: [admin-announcement-controller]
      summary: Delete announcement
      description: Soft deletion, no restore API. Retains row and actor snapshots. Repeated deletion of existing row returns204 without another audit event; missing row404.
      operationId: deleteAnnouncement
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: integer, format: int64}
      responses:
        '400':
          description: Invalid announcement or bounds
          content: {application/json: {schema: {$ref: '#/components/schemas/ApiErrorResponse'}}}
        '401':
          description: Authentication required
          content: {application/json: {schema: {$ref: '#/components/schemas/ApiErrorResponse'}}}
        '403':
          description: Admin required
          content: {application/json: {schema: {$ref: '#/components/schemas/ApiErrorResponse'}}}
        '404':
          description: Module disabled or announcement missing/deleted
          content: {application/json: {schema: {$ref: '#/components/schemas/ApiErrorResponse'}}}
        '204': {description: Announcement deleted}
      security:
      - bearerAuth: []
  /api/v1/announcements/active:
    get:
      tags: [announcement-controller]
      summary: Read active global announcements
      description: Authenticated users/admins, global audience. Active/non-deleted and starts_at<=now (or null), ends_at>now (or null), UTC. Priority DESC,COALESCE(starts_at,created_at) DESC,id DESC. Limit default10/max50. Plain-text fields require safe client rendering; URLs are never fetched. ANNOUNCEMENTS_ENABLED defaultsfalse; disabled404. No cache or scheduler.
      operationId: activeAnnouncements
      parameters:
      - name: limit
        in: query
        required: false
        schema: {type: integer, format: int32, maximum: 50, minimum: 1}
      responses:
        '200':
          description: Active announcements
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AnnouncementResponse'}
        '400':
          description: Invalid limit
          content: {application/json: {schema: {$ref: '#/components/schemas/ApiErrorResponse'}}}
        '401':
          description: Authentication required
          content: {application/json: {schema: {$ref: '#/components/schemas/ApiErrorResponse'}}}
        '403':
          description: User/admin role required
          content: {application/json: {schema: {$ref: '#/components/schemas/ApiErrorResponse'}}}
        '404':
          description: Module disabled
          content: {application/json: {schema: {$ref: '#/components/schemas/ApiErrorResponse'}}}
      security:
      - bearerAuth: []
  /api/v1/posts/trending:
    get:
      tags: [trending-controller]
      summary: Read trending post summaries
      description: Authenticated user/admin. TRENDING_ENABLED defaultsfalse; disabled404. Window default7d, supported24h/7d/30d, limit default10/max50. Highest approved/latest/non-deleted version per logical post, known approved_at within [calculated_at-window,calculated_at). Counts currently held votes on that version with changed_at in same UTC window; legacy-null/future dates excluded. Score=(1+recent_upvotes)/((1+recent_downvotes)*POWER(2+age_hours,1.5)), age since UTC approval. Order score DESC,approved_at DESC,id DESC. No score, private body, files or entity graphs returned; no view tracking, URL fetching, cache or search-sort alias. Vote toggles cannot accumulate duplicates; not a complete anti-abuse system.
      operationId: trendingPosts
      parameters:
      - name: window
        in: query
        required: false
        schema: {type: string, enum: [24h, 7d, 30d]}
      - name: limit
        in: query
        required: false
        schema: {type: integer, format: int32, maximum: 50, minimum: 1}
      responses:
        '200':
          description: Trending summaries
          content: {application/json: {schema: {$ref: '#/components/schemas/TrendingResponse'}}}
        '400':
          description: Invalid window or limit
          content: {application/json: {schema: {$ref: '#/components/schemas/ApiErrorResponse'}}}
        '401':
          description: Authentication required
          content: {application/json: {schema: {$ref: '#/components/schemas/ApiErrorResponse'}}}
        '403':
          description: User/admin role required
          content: {application/json: {schema: {$ref: '#/components/schemas/ApiErrorResponse'}}}
        '404':
          description: Module disabled
          content: {application/json: {schema: {$ref: '#/components/schemas/ApiErrorResponse'}}}
      security:
      - bearerAuth: []
  /api/v1/admin/audit-events:
    get:
      tags: [admin-audit-controller]
      summary: Read audit events
      description: "Admin-only paged export/query. Stable occurred_at DESC,id DESC. Page 0–10000, size 1–100 (defaults 0/20). Exact allowlisted action/outcome/target_type and positive actor_id/target_id filters; target_id requires target_type. UTC [from,to), positive maximum 90 days, default trailing 90 days, offsets accepted, microsecond precision, years 1000–9999. Numeric actor/target IDs survive deletion; metadata contains only validated role for role changes, otherwise an empty object. No credentials, addresses, content or file paths. Events begin at deployment; one-year retention is manually managed by database operator. No update/delete API or cross-request export snapshot."
      operationId: query
      parameters:
      - name: page
        in: query
        required: false
        schema: {type: integer, format: int32, minimum: 0, maximum: 10000}
      - name: size
        in: query
        required: false
        schema: {type: integer, format: int32, minimum: 1, maximum: 100}
      - name: action
        in: query
        required: false
        schema:
          type: string
          enum: [LOGIN, PASSWORD_RESET, PASSWORD_RECOVERY, ACCESS_DENIED, ADMIN_CREATED, ROLE_ADDED, ROLE_REMOVED, USER_DELETED, EMAIL_BANNED, EMAIL_UNBANNED, POST_DELETED, POST_APPROVED, POST_REJECTED, SCHOOL_CREATED, SCHOOL_UPDATED, SCHOOL_DELETED, DEPARTMENT_CREATED, DEPARTMENT_UPDATED, DEPARTMENT_DELETED, SUBJECT_CREATED, SUBJECT_UPDATED, SUBJECT_DELETED, AVATAR_CHANGED, COVER_CHANGED, COVER_REMOVED, ANNOUNCEMENT_CREATED, ANNOUNCEMENT_UPDATED, ANNOUNCEMENT_DELETED]
      - name: outcome
        in: query
        required: false
        schema: {type: string, enum: [SUCCESS, DENIED, ERROR, ACCEPTED]}
      - name: target_type
        in: query
        required: false
        schema: {type: string, enum: [USER, SECURITY, BANNED_EMAIL, POST, POST_VERSION, SCHOOL, DEPARTMENT, SUBJECT, ANNOUNCEMENT]}
      - name: actor_id
        in: query
        required: false
        schema: {type: integer, format: int64, minimum: 1}
      - name: target_id
        in: query
        required: false
        schema: {type: integer, format: int64, minimum: 1}
      - name: from
        in: query
        required: false
        schema: {type: string, format: date-time}
      - name: to
        in: query
        required: false
        schema: {type: string, format: date-time}
      responses:
        '200':
          description: Audit page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditEventPage'}
        '400':
          description: Invalid bounds or filters
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiErrorResponse'}
        '401':
          description: Authentication required
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiErrorResponse'}
        '403':
          description: Admin required
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiErrorResponse'}
      security:
      - bearerAuth: []
  /api/v1/admin/dashboard:
    get:
      tags: [admin-dashboard-controller]
      summary: Read admin dashboard aggregates
      description: "ROLE_ADMIN only. Current counts are not window-filtered. Current logical status uses highest version, including rejected rows without a latest flag; deleted logical posts are separate. Period creations count version 1; approvals count version rows with recorded approved_at, including superseded/deleted rows. Legacy approval dates remain unknown and are reported separately. Engagement counts approved/latest/non-deleted rows, including activity by deleted users. Attachment bytes are known nonnegative metadata, not disk usage; unknown sizes are reported separately. UTC [from,to), positive range at most 90 days; default to=calculation time, from=to minus 90 days. Offsets accepted; maximum microsecond precision and UTC years 1000–9999. Legacy creation times retain their original stored clock. Seven aggregate queries in one read-only repeatable-read transaction; no cache."
      operationId: dashboard
      parameters:
      - name: from
        in: query
        description: Inclusive ISO offset date-time, default to minus 90 days
        required: false
        schema: {type: string, format: date-time}
      - name: to
        in: query
        description: Exclusive ISO offset date-time, default calculation time
        required: false
        schema: {type: string, format: date-time}
      responses:
        '200':
          description: Admin aggregates
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminDashboardResponse'}
        '400':
          description: Invalid date window
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiErrorResponse'}
        '401':
          description: Authentication required
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiErrorResponse'}
        '403':
          description: Admin role required
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiErrorResponse'}
      security:
      - bearerAuth: []
  /api/v1/user/{userId}/stats:
    get:
      tags: [profile-statistics-controller]
      summary: Read user profile statistics
      description: "Same public aggregate set for all authenticated roles: approved/latest/non-deleted version rows. Post count deduplicates logical post_id; votes are counted on eligible version row IDs, including retained votes by deleted voters. Deleted user profiles return 404."
      operationId: userStats
      security:
      - bearerAuth: []
      parameters:
      - name: X-Request-ID
        in: header
        description: Optional safe correlation ID; invalid values are replaced by a UUID
        schema: {type: string}
      - name: userId
        in: path
        required: true
        schema: {type: integer, format: int64, minimum: 1}
      responses:
        "200":
          description: User aggregate statistics
          headers:
            X-Request-ID:
              description: Safe request correlation ID
              style: simple
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStatsResponse'
        "400":
          description: Invalid profile ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        "403":
          description: Profile access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        "404":
          description: Profile missing or user deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/subject/{subjectId}/stats:
    get:
      tags: [profile-statistics-controller]
      summary: Read subject profile statistics
      description: Counts distinct logical post_id among linked approved/latest/non-deleted rows. last_approved_post_at is MAX of eligible Post.updated_at, using its existing stored clock; null when empty. Active posts by deleted authors remain counted, consistent with existing post visibility. Owners/admins receive no private moderation counts.
      operationId: subjectStats
      security:
      - bearerAuth: []
      parameters:
      - name: X-Request-ID
        in: header
        description: Optional safe correlation ID; invalid values are replaced by a UUID
        schema: {type: string}
      - name: subjectId
        in: path
        required: true
        schema: {type: integer, format: int64, minimum: 1}
      responses:
        "200":
          description: Subject aggregate statistics
          headers:
            X-Request-ID:
              description: Safe request correlation ID
              style: simple
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectStatsResponse'
        "400":
          description: Invalid profile ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        "403":
          description: Profile access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        "404":
          description: Profile missing or user deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/auth/password-recovery:
    post:
      tags: [password-recovery-controller]
      summary: Request password recovery
      description: Anonymous. Always returns the same accepted message for eligible, missing, deleted or banned accounts. A configured email provider receives a single-use reset link after commit; provider errors do not disclose eligibility. Recovery must be configured/enabled before use. Email is normalized for shared per-email and trusted-client-IP limits.
      operationId: request
      security: []
      parameters:
      - name: X-Request-ID
        in: header
        description: Optional safe correlation ID; invalid values are replaced by a UUID
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRecoveryRequest'
      responses:
        "202":
          description: Generic recovery acknowledgment; no token/account details
          headers:
            X-Request-ID:
              description: Safe request correlation ID
              style: simple
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        "400":
          description: Invalid request or invalid/expired reset token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        "429":
          description: Recovery email/client-IP budget exhausted
          headers:
            Retry-After:
              description: Seconds until retry
              style: simple
              schema: {type: integer, format: int64}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        "503":
          description: Password recovery not configured/enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/auth/password-reset:
    post:
      tags: [password-recovery-controller]
      summary: Complete password reset
      description: Anonymous. Submit the 43-character token from the emailed URL fragment and new_password. Password requires 8+ characters, uppercase/lowercase/digit and at most 72 UTF-8 bytes. Token is single-use, expires after configured TTL (default 15 minutes), and newer requests supersede earlier unused tokens. Success revokes all refresh sessions and requires fresh login; existing access JWTs retain their remaining normal lifetime.
      operationId: reset
      security: []
      parameters:
      - name: X-Request-ID
        in: header
        description: Optional safe correlation ID; invalid values are replaced by a UUID
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        "200":
          description: Password changed; sign in again
          headers:
            X-Request-ID:
              description: Safe request correlation ID
              style: simple
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        "400":
          description: Invalid request or invalid/expired reset token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        "429":
          description: Recovery email/client-IP budget exhausted
          headers:
            Retry-After:
              description: Seconds until retry
              style: simple
              schema: {type: integer, format: int64}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        "503":
          description: Password recovery not configured/enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/posts/search:
    get:
      tags: [post-controller]
      summary: Search and page posts
      description: Filters intersect. Default results are APPROVED, latest and non-deleted for every role. q uses MySQL natural-language full-text over title/content; blank q is absent. Default sort is relevance with q, newest otherwise. from is inclusive and to exclusive on stored created_at (ISO local date-times, no timezone conversion). Explicit status requires admin; non-approved status searches use newest stored revision per logical post, including rejected revisions.
      operationId: searchPosts
      security:
      - bearerAuth: []
      parameters:
      - name: X-Request-ID
        in: header
        description: "Optional correlation ID: 1-64 letters, digits, dots, underscores or hyphens; invalid values are replaced by a UUID"
        schema: {type: string}
      - name: q
        in: query
        description: Natural-language title/content query; maximum 200 characters
        required: false
        schema: {type: string, maxLength: 200}
      - name: subject_id
        in: query
        required: false
        schema: {type: integer, format: int64, minimum: 1}
      - name: department_id
        in: query
        required: false
        schema: {type: integer, format: int64, minimum: 1}
      - name: author_id
        in: query
        required: false
        schema: {type: integer, format: int64, minimum: 1}
      - name: from
        in: query
        description: Inclusive created_at lower bound, no offset
        required: false
        schema: {type: string}
        example: '2026-01-01T00:00:00'
      - name: to
        in: query
        description: Exclusive created_at upper bound, no offset
        required: false
        schema: {type: string}
        example: '2026-02-01T00:00:00'
      - name: page
        in: query
        required: false
        schema: {type: integer, format: int32, minimum: 0, default: 0}
      - name: size
        in: query
        required: false
        schema: {type: integer, format: int32, minimum: 1, maximum: 100, default: 20}
      - name: sort
        in: query
        required: false
        schema: {type: string, enum: [newest, oldest, relevance, vote_score]}
      - name: status
        in: query
        description: Admin only
        required: false
        schema: {type: string, enum: [APPROVED, PENDING_APPROVAL, REJECTED, SUPERSEDED]}
      responses:
        "200":
          description: Bounded page of existing PostResponse objects
          headers:
            X-Request-ID:
              description: Safe request correlation ID
              style: simple
              schema: {type: string}
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PostSearchResponse'
        "400":
          description: Invalid filter, date range, page, size or sort
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        "403":
          description: Explicit status filter requires admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/vaults/edit-label:
    put:
      tags:
      - vault-controller
      operationId: editLabel
      description: Request post_id is a post version database row id, not logical post_id. Deleted posts are inaccessible.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditVaultLabelRequest"
        required: true
      responses:
        "200":
          description: Label updated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VaultResponse"
        "404":
          description: Post not found, including deleted posts
        "401":
          description: Authentication required
  /api/v1/user/{userId}:
    get:
      tags:
      - user-controller
      operationId: getUserDetails
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
    put:
      tags:
      - user-controller
      operationId: updateUser
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
        required: true
      responses:
        "200":
          description: User updated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MessageResponse"
    delete:
      tags:
      - user-controller
      operationId: deleteUser
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
