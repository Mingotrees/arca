components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiErrorResponse:
      type: object
      required: [error, message, status, timestamp]
      properties:
        timestamp: {type: string}
        status: {type: integer, format: int32}
        error: {type: string}
        message: {type: string}
    PostSearchResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/PostResponse'
        page: {type: integer, format: int32}
        size: {type: integer, format: int32}
        sort: {type: string}
        total_elements: {type: integer, format: int64}
        total_pages: {type: integer, format: int64}
    EditVaultLabelRequest:
      type: object
      properties:
        post_id:
          type: integer
          format: int64
        new_label:
          type: string
          maxLength: 255
          minLength: 0
      required: [post_id]
    VaultResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        label:
          type: string
        post_id:
          type: integer
          format: int64
    UserUpdateRequest:
      type: object
      properties:
        bio:
          type: string
        course:
          type: string
        department:
          type: string
        first_name:
          type: string
        last_name:
          type: string
    ProfilePictureResponse:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        profilePicture:
          type: string
        message:
          type: string
    SubjectRequest:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        aliases:
          type: array
          items:
            type: string
        departmentIds:
          type: array
          items:
            type: integer
            format: int64
    DepartmentResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    SubjectResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        name:
          type: string
        aliases:
          type: array
          items:
            type: string
        departments:
          type: array
          items:
            $ref: "#/components/schemas/DepartmentResponse"
    SchoolRequest:
