name: Deploy Backend to DCISM

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dcism-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build backend
        run: ./mvnw --batch-mode clean package -DskipTests

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DCISM_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DCISM_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Upload new JAR
        env:
          DCISM_HOST: ${{ secrets.DCISM_HOST }}
          DCISM_PORT: ${{ secrets.DCISM_PORT }}
          DCISM_USER: ${{ secrets.DCISM_USER }}
          DCISM_DEPLOY_PATH: ${{ secrets.DCISM_DEPLOY_PATH }}
        run: |
          scp \
            -i ~/.ssh/id_ed25519 \
            -P "$DCISM_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            target/arca-*.jar \
            "$DCISM_USER@$DCISM_HOST:$DCISM_DEPLOY_PATH/arca.jar.next"

      - name: Restart and verify backend
        env:
          DCISM_HOST: ${{ secrets.DCISM_HOST }}
          DCISM_PORT: ${{ secrets.DCISM_PORT }}
          DCISM_USER: ${{ secrets.DCISM_USER }}
          DCISM_DEPLOY_PATH: ${{ secrets.DCISM_DEPLOY_PATH }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "$DCISM_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DCISM_USER@$DCISM_HOST" \
            "bash -s -- '$DCISM_DEPLOY_PATH'" <<'REMOTE'
          set -eu

          DEPLOY_PATH="$1"
          cd "$DEPLOY_PATH"

          if [ ! -f .env ]; then
            echo "Missing $DEPLOY_PATH/.env"
            exit 1
          fi

          if [ ! -f arca.jar.next ]; then
            echo "Uploaded JAR was not found"
            exit 1
          fi

          # Save the current version for rollback.
          if [ -f arca.jar ]; then
            cp arca.jar arca.jar.previous
          elif [ -f arca-0.0.1-SNAPSHOT.jar ]; then
            cp arca-0.0.1-SNAPSHOT.jar arca.jar.previous
          fi

          CURRENT_PID=""
          if [ -f arca.pid ]; then
            CURRENT_PID="$(cat arca.pid)"
          fi

          case "$CURRENT_PID" in
            ""|*[!0-9]*)
              CURRENT_PID=""
              ;;
          esac

          if [ -n "$CURRENT_PID" ] && kill -0 "$CURRENT_PID" 2>/dev/null; then
            echo "Stopping backend process $CURRENT_PID"
            kill "$CURRENT_PID"

            for attempt in {1..30}; do
              if ! kill -0 "$CURRENT_PID" 2>/dev/null; then
                break
              fi
              sleep 1
            done

            if kill -0 "$CURRENT_PID" 2>/dev/null; then
              kill -9 "$CURRENT_PID"
            fi
          else
            # Handles the existing manually started deployment on the first run.
            pkill -f 'java .*arca-0\.0\.1-SNAPSHOT\.jar' 2>/dev/null || true
            pkill -f 'java .*arca\.jar' 2>/dev/null || true
            sleep 3
          fi

          rm -f arca.pid
          mv arca.jar.next arca.jar
          mv arca.log arca.log.previous 2>/dev/null || true

          echo "Starting new backend"
          nohup java -jar arca.jar > arca.log 2>&1 < /dev/null &
          NEW_PID=$!
          printf '%s\n' "$NEW_PID" > arca.pid

          HEALTHY=false

          for attempt in {1..12}; do
            if curl \
              --fail \
              --silent \
              --max-time 5 \
              http://127.0.0.1:20255/v3/api-docs \
              > /dev/null; then
              HEALTHY=true
              break
            fi

            if ! kill -0 "$NEW_PID" 2>/dev/null; then
              break
            fi

            sleep 5
          done

          if [ "$HEALTHY" = true ]; then
            echo "Deployment succeeded. Backend PID: $NEW_PID"
            exit 0
          fi

          echo "Deployment health check failed"
          cp arca.log arca.failed.log 2>/dev/null || true
          kill "$NEW_PID" 2>/dev/null || true
          rm -f arca.pid

          if [ -f arca.jar.previous ]; then
            echo "Restoring previous backend"
            cp arca.jar.previous arca.jar
            nohup java -jar arca.jar > arca.log 2>&1 < /dev/null &
            printf '%s\n' "$!" > arca.pid
          fi

          if [ -f arca.failed.log ]; then
            tail -n 100 arca.failed.log
          fi

          exit 1
          REMOTE
