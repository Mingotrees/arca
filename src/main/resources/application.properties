spring.application.name=arca
app.homepage.announcements-enabled=${ANNOUNCEMENTS_ENABLED:false}
app.homepage.trending-enabled=${TRENDING_ENABLED:false}
spring.profiles.active=dev
file.upload-dir=uploads
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=validate
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.readiness.additional-path=server:/readyz
management.endpoint.health.group.readiness.show-details=never
management.endpoint.health.group.readiness.show-components=never
app.password-recovery.enabled=${PASSWORD_RECOVERY_ENABLED:false}
app.password-recovery.reset-link-base-url=${PASSWORD_RECOVERY_URL:}
app.password-recovery.from=${PASSWORD_RECOVERY_FROM:}
app.password-recovery.rate-key-secret=${PASSWORD_RECOVERY_RATE_KEY_SECRET:}
app.password-recovery.token-ttl=${PASSWORD_RECOVERY_TOKEN_TTL:PT15M}
app.password-recovery.rate-window=${PASSWORD_RECOVERY_RATE_WINDOW:PT15M}
app.password-recovery.email-limit=${PASSWORD_RECOVERY_EMAIL_LIMIT:3}
app.password-recovery.ip-limit=${PASSWORD_RECOVERY_IP_LIMIT:10}
app.password-recovery.reset-ip-limit=${PASSWORD_RECOVERY_RESET_IP_LIMIT:20}
app.password-recovery.trusted-proxies=${PASSWORD_RECOVERY_TRUSTED_PROXIES:}
# Recovery has its own explicit trusted-proxy resolver; preserve the socket peer.
server.forward-headers-strategy=none
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtps.connectiontimeout=5000
spring.mail.properties.mail.smtps.timeout=5000
spring.mail.properties.mail.smtps.writetimeout=5000
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtps.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.debug=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS configuration (set to your frontend origins)
app.cors.allowed-origins=http://localhost:5173,https://arca-292333624176.asia-east2.run.app,https://arca.dcism.org
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
app.cors.allowed-headers=Authorization,Content-Type,Cache-Control,X-Request-ID
