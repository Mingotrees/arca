spring.application.name=arca
spring.profiles.active=dev
file.upload-dir=uploads
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=validate
management.endpoints.web.exposure.include=health,metrics
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS configuration (set to your frontend origins)
app.cors.allowed-origins=http://localhost:5173,https://arca-292333624176.asia-east2.run.app,https://arca.dcism.org
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
app.cors.allowed-headers=Authorization,Content-Type,Cache-Control,X-Request-ID
